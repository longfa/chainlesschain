name: VS Code macOS Session Fork

on:
  workflow_dispatch:
    inputs:
      cli_sha:
        description: Exact CLI candidate commit
        required: true
        type: string
      ide_sha:
        description: Exact IDE candidate commit
        required: true
        type: string
      vsix_run_id:
        description: Successful IDE Extensions push run that produced the candidate VSIX
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  session-fork:
    name: Installed VSIX session fork and workflow map (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      CLI_SHA: ${{ inputs.cli_sha }}
      IDE_SHA: ${{ inputs.ide_sha }}
      VSIX_RUN_ID: ${{ inputs.vsix_run_id }}
      VSCODE_VERSION: "1.145.2"
      npm_config_onnxruntime_node_install_cuda: skip
    steps:
      - name: Validate candidate selectors
        shell: bash
        run: |
          [[ "$CLI_SHA" =~ ^[0-9a-f]{40}$ && "$IDE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VSIX_RUN_ID" =~ ^[1-9][0-9]*$ ]]

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.cli_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Verify both candidate source identities and VSIX producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$CLI_SHA"
          git fetch --no-tags --depth=1 origin "$IDE_SHA"
          git diff --exit-code "$IDE_SHA" "$CLI_SHA" -- packages/vscode-extension
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VSIX_RUN_ID" > "$RUNNER_TEMP/vsix-producer.json"
          node --input-type=module - "$RUNNER_TEMP/vsix-producer.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const run = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assert.equal(run.head_sha, process.env.IDE_SHA);
          assert.equal(run.head_repository.full_name, process.env.GITHUB_REPOSITORY);
          assert.equal(run.path, ".github/workflows/ide-extensions.yml");
          assert.equal(run.event, "push");
          assert.equal(run.head_branch, "main");
          assert.equal(run.conclusion, "success");
          NODE

      - uses: actions/download-artifact@v6
        with:
          name: chainlesschain-ide-vscode-candidate
          path: ${{ runner.temp }}/fork-candidate
          github-token: ${{ github.token }}
          run-id: ${{ inputs.vsix_run_id }}

      - name: Verify manifest and CLI pairing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import path from "node:path";
          import { verifyVsixReleaseArtifact } from "./packages/vscode-extension/scripts/vsix-release-artifact.mjs";
          const read = (file) => JSON.parse(readFileSync(file, "utf8"));
          const cli = read("packages/cli/package.json");
          const ide = read("packages/vscode-extension/package.json");
          assert.equal(cli.version, ide.chainlesschain.recommendedCliVersion);
          const candidate = path.join(process.env.RUNNER_TEMP, "fork-candidate");
          const { GITHUB_SERVER_URL, GITHUB_REPOSITORY, IDE_SHA, VSIX_RUN_ID } = process.env;
          verifyVsixReleaseArtifact(
            path.join(candidate, "chainlesschain-ide.vsix"),
            read(path.join(candidate, "manifest.json")),
            {
              commit: IDE_SHA,
              version: ide.version,
              publisher: ide.publisher,
              packageName: ide.name,
              workflowRun: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${VSIX_RUN_ID}`,
            },
          );
          NODE

      - name: Install CLI and Extension Host test dependencies
        shell: bash
        run: |
          npm ci --workspace packages/cli --include-workspace-root=false --legacy-peer-deps --no-audit --no-fund
          npm --prefix packages/vscode-extension install --no-save --no-package-lock @vscode/test-electron@3.1.0 ws@8.21.2

      - name: Verify forked sessions and the running workflow map
        working-directory: packages/vscode-extension
        shell: bash
        timeout-minutes: 12
        run: |
          report="$RUNNER_TEMP/fork-evidence"
          mkdir -p "$report"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { writeFileSync } from "node:fs";
          import path from "node:path";
          import { downloadAndUnzipVSCode } from "@vscode/test-electron";
          assert.equal(process.platform, "darwin");
          assert.equal(process.arch, "x64");
          const executable = await downloadAndUnzipVSCode({ version: process.env.VSCODE_VERSION });
          writeFileSync(path.join(process.env.RUNNER_TEMP, "fork-vscode-executable"), executable);
          NODE
          # VS Code's profile socket must fit Darwin's 103-byte path limit.
          short_tmp="$(node -p 'require("node:fs").realpathSync("/tmp")')"
          TMPDIR="$short_tmp" node test/extension-host/run-session-fork.cjs \
            --vscode-executable "$(cat "$RUNNER_TEMP/fork-vscode-executable")" \
            --vscode-version "$VSCODE_VERSION" \
            --vsix "$RUNNER_TEMP/fork-candidate/chainlesschain-ide.vsix" \
            2>&1 | tee "$report/session-fork.log"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync } from "node:fs";
          import path from "node:path";
          const { RUNNER_TEMP, VSCODE_VERSION, CLI_SHA, IDE_SHA, VSIX_RUN_ID } = process.env;
          const candidate = path.join(RUNNER_TEMP, "fork-candidate");
          const report = path.join(RUNNER_TEMP, "fork-evidence");
          const log = path.join(report, "session-fork.log");
          const receipts = readFileSync(log, "utf8").split(/\r?\n/u).flatMap((line) => {
            try {
              const entry = JSON.parse(line);
              return entry?.independentSideEffectLedgers === true ? [entry] : [];
            } catch {
              return [];
            }
          });
          assert.equal(receipts.length, 1);
          const [receipt] = receipts;
          const manifest = JSON.parse(readFileSync(path.join(candidate, "manifest.json"), "utf8"));
          assert.equal(receipt.vscode, VSCODE_VERSION);
          assert.equal(receipt.extension, manifest.version);
          assert.equal(receipt.independentTranscripts, true);
          assert.equal(receipt.workflowState, "running");
          const result = { ...receipt, cliSha: CLI_SHA, ideSha: IDE_SHA, vsixRunId: VSIX_RUN_ID,
            vsixSha256: manifest.sha256, platform: process.platform, architecture: process.arch };
          console.log(JSON.stringify(result));
          writeFileSync(path.join(report, "session-fork.json"), JSON.stringify(result, null, 2) + "\n");
          NODE

      - name: Upload fork journey receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vscode-macos-session-fork-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fork-evidence/
          if-no-files-found: warn
