name: VERIFY01 Host Diagnostics
run-name: >-
  ${{ inputs.mcp_startup_manifest != '' && 'macOS installed MCP startup diagnostic'
      || github.event_name == 'workflow_dispatch' && inputs.descendant_repetitions != 0
      && format('Owned-descendant investigation ({0} rounds, diagnostic only)', inputs.descendant_repetitions)
      || 'VERIFY01 Host Diagnostics' }}

# Real installed IDEs with a deterministic, keyless peer. These checks do not
# consume the 36+9 formal samples, attest public installation, or publish.
on:
  workflow_dispatch:
    inputs:
      mcp_startup_manifest:
        description: "Exact prerelease package-set manifest for a macOS MCP startup measurement"
        type: string
        required: false
        default: ""
      descendant_repetitions:
        description: "Diagnostic only: 1..100 macOS descendant checks; 0 runs the full host workflow"
        type: number
        required: false
        default: 0
  pull_request:
    paths:
      - ".github/actions/prepare-ubuntu-apt-dns/**"
      - "scripts/lib/ubuntu-apt-dns.cjs"
      - "scripts/__tests__/ubuntu-apt-dns.test.mjs"
      - "packages/vscode-extension/**"
      - "packages/jetbrains-plugin/**"
      - "packages/cli/src/**"
      - "tests/fixtures/ide-roadmap/**"
      - "scripts/lib/verify01-*.mjs"
      - "scripts/__tests__/verify01-*.test.mjs"
      - "scripts/diagnostics/owned-descendant-campaign.mjs"
      - "scripts/__tests__/owned-descendant-campaign.test.mjs"
      - "package-lock.json"
      - ".github/workflows/verify01-host-diagnostics.yml"
  push:
    branches: [main, "feature/cli-ide-gap-*"]
    paths:
      - ".github/actions/prepare-ubuntu-apt-dns/**"
      - "scripts/lib/ubuntu-apt-dns.cjs"
      - "scripts/__tests__/ubuntu-apt-dns.test.mjs"
      - "packages/vscode-extension/**"
      - "packages/jetbrains-plugin/**"
      - "packages/cli/src/**"
      - "tests/fixtures/ide-roadmap/**"
      - "scripts/lib/verify01-*.mjs"
      - "scripts/__tests__/verify01-*.test.mjs"
      - "scripts/diagnostics/owned-descendant-campaign.mjs"
      - "scripts/__tests__/owned-descendant-campaign.test.mjs"
      - "package-lock.json"
      - ".github/workflows/verify01-host-diagnostics.yml"

permissions:
  contents: read

env:
  VERIFY01_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  mcp-startup-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.mcp_startup_manifest != ''
    runs-on: macos-15-intel
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      VERIFY01_MCP_MANIFEST: ${{ inputs.mcp_startup_manifest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERIFY01_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
      - name: Download the immutable candidate package set
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFY01_SOURCE_SHA"
          [[ "$VERIFY01_MCP_MANIFEST" =~ ^docs/research/cli/verify01-package-sets/[a-zA-Z0-9_.-]+\.json$ ]]
          git ls-files --error-unmatch -- "$VERIFY01_MCP_MANIFEST"
          node packages/cli/scripts/verify01-prerelease-package-set.mjs "$VERIFY01_MCP_MANIFEST" "$RUNNER_TEMP/mcp-candidate"
      - name: Install and measure cold and warm terminal startup
        shell: bash
        run: |
          set -euo pipefail
          package_file=$(node -e 'process.stdout.write(require("./" + process.argv[1]).prepublication.files.cli.file)' "$VERIFY01_MCP_MANIFEST")
          mkdir "$RUNNER_TEMP/mcp-installed"
          npm install --prefix "$RUNNER_TEMP/mcp-installed" --no-audit --no-fund "$CC_VERIFY01_PRERELEASE_DIRECTORY/$package_file"
          node scripts/diagnostics/verify01-mcp-startup-timing.mjs "$VERIFY01_MCP_MANIFEST" "$CC_VERIFY01_PRERELEASE_DIRECTORY" "$RUNNER_TEMP/mcp-installed" "$RUNNER_TEMP/mcp-startup.json"
      - uses: actions/upload-artifact@v6
        with:
          name: verify01-mcp-startup-macos-${{ github.run_id }}
          path: ${{ runner.temp }}/mcp-startup.json
          if-no-files-found: error

  descendant-reproduction:
    name: macOS owned-descendant reproduction (diagnostic only)
    if: github.event_name == 'workflow_dispatch' && inputs.mcp_startup_manifest == '' && inputs.descendant_repetitions != 0
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Verify campaign failure handling
        run: node --test scripts/__tests__/owned-descendant-campaign.test.mjs
      - name: Repeat the original assertion and stop on the first failure
        timeout-minutes: 10
        shell: bash
        env:
          REPETITIONS: ${{ inputs.descendant_repetitions }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/diagnostics/owned-descendant-campaign.mjs \
            --rounds "$REPETITIONS" \
            --output "$RUNNER_TEMP/owned-descendant-campaign"
      - name: Retain every completed round and the first failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: owned-descendant-diagnostic-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owned-descendant-campaign/
          if-no-files-found: error
          retention-days: 90

  vscode-package:
    if: github.event_name != 'workflow_dispatch' || (inputs.mcp_startup_manifest == '' && inputs.descendant_repetitions == 0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERIFY01_SOURCE_SHA }}
      - name: Verify exact candidate source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$VERIFY01_SOURCE_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Package exact source candidate
        working-directory: packages/vscode-extension
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies --out verify01.vsix
      - uses: actions/upload-artifact@v6
        with:
          name: verify01-vsix
          path: packages/vscode-extension/verify01.vsix
          if-no-files-found: error

  host:
    name: ${{ matrix.host }} (${{ matrix.os }})
    needs: vscode-package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        host: [vscode, jetbrains]
    steps:
      - name: Enable Windows long paths before checkout
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERIFY01_SOURCE_SHA }}
      - name: Verify exact candidate source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$VERIFY01_SOURCE_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"
      - name: Install canonical store fixture dependencies
        run: >-
          npm ci --workspace packages/cli --include-workspace-root=false
          --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Verify process deadlines and evidence rejection
        run: >-
          node --test scripts/__tests__/verify01-diagnostic-process.test.mjs
          scripts/__tests__/verify01-gradle-bootstrap.test.mjs
          scripts/__tests__/verify01-diagnostic-port.test.mjs
          scripts/__tests__/verify01-diagnostic-evidence.test.mjs
          scripts/__tests__/verify01-diagnostic-command-drain.test.mjs
          scripts/__tests__/verify01-onboarding-fixture.test.mjs
          scripts/__tests__/verify01-cold-evidence.test.mjs
          scripts/__tests__/verify01-cold-boundaries.test.mjs
          scripts/__tests__/verify01-init-gate.test.mjs
          scripts/__tests__/owned-descendant-campaign.test.mjs
          packages/vscode-extension/test/verify01-diagnostic.test.cjs
          packages/vscode-extension/test/verify01-config.test.cjs
      - name: Prepare Ubuntu repository DNS
        if: runner.os == 'Linux'
        uses: ./.github/actions/prepare-ubuntu-apt-dns
      - name: Install Linux virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - uses: actions/download-artifact@v6
        if: matrix.host == 'vscode'
        with:
          name: verify01-vsix
          path: packages/vscode-extension
      - name: Prepare exact VS Code outside task deadline
        if: matrix.host == 'vscode'
        working-directory: packages/vscode-extension
        run: |
          npm install --no-save --no-package-lock @vscode/test-electron@3.1.0 ws@8.21.2
          node -e "require('@vscode/test-electron').downloadAndUnzipVSCode({version:'1.132.0',cachePath:require('node:path').resolve('.vscode-test')}).catch(e=>{console.error(e);process.exitCode=1})"
      - name: Run VS Code initial/restart capture
        if: matrix.host == 'vscode'
        shell: bash
        working-directory: packages/vscode-extension
        run: |
          extension_version=$(node -p "require('./package.json').version")
          display=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            display=(xvfb-run --auto-servernum '--server-args=-screen 0 1920x1080x24')
          fi
          "${display[@]}" node test/extension-host/verify01-diagnostic.cjs \
            --vsix verify01.vsix --host-version 1.132.0 --extension-version "$extension_version" \
            --artifact-dir ../../verify01-artifacts/vscode
      - uses: actions/setup-java@v5
        if: matrix.host == 'jetbrains'
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare Gradle wrapper
        if: matrix.host == 'jetbrains' && runner.os != 'Windows'
        run: chmod +x packages/jetbrains-plugin/gradlew
      - name: Bootstrap pinned Gradle before the IDE journey
        if: matrix.host == 'jetbrains'
        run: >-
          node scripts/lib/verify01-gradle-bootstrap.mjs
          --project-dir packages/jetbrains-plugin
          --artifact-dir verify01-artifacts/gradle-bootstrap
      - name: Run IntelliJ initial/restart capture
        if: matrix.host == 'jetbrains'
        shell: bash
        run: |
          display=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            display=(xvfb-run --auto-servernum '--server-args=-screen 0 1920x1080x24')
          fi
          "${display[@]}" node packages/jetbrains-plugin/scripts/verify01-diagnostic.mjs \
            --ide-version 2024.2 --artifact-dir verify01-artifacts/jetbrains
      - name: Run IntelliJ identity discovery and repair in one IDE process
        if: matrix.host == 'jetbrains'
        shell: bash
        run: |
          display=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            display=(xvfb-run --auto-servernum '--server-args=-screen 0 1920x1080x24')
          fi
          "${display[@]}" node packages/jetbrains-plugin/scripts/onboarding-diagnostic.mjs \
            --ide-version 2024.2 --artifact-dir verify01-artifacts/onboarding
      - name: Run IntelliJ bounded cold initialization and explicit retry
        if: matrix.host == 'jetbrains'
        shell: bash
        run: |
          display=()
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            display=(xvfb-run --auto-servernum '--server-args=-screen 0 1920x1080x24')
          fi
          "${display[@]}" node packages/jetbrains-plugin/scripts/verify01-diagnostic.mjs \
            --journey cold --ide-version 2024.2 --artifact-dir verify01-artifacts/cold
          "${display[@]}" node packages/jetbrains-plugin/scripts/verify01-diagnostic.mjs \
            --journey cold-boundaries --ide-version 2024.2 --artifact-dir verify01-artifacts/cold-boundaries
      - name: Preserve successful and failed attempts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verify01-${{ matrix.host }}-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            verify01-artifacts/
            packages/jetbrains-plugin/build/reports/tests/uiSmokeTest/
            packages/jetbrains-plugin/build/reports/ui-smoke/
          include-hidden-files: true
          if-no-files-found: warn
