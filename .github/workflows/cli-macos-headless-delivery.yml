name: CLI macOS Plan Validation
run-name: CLI macOS ${{ inputs.check }} for ${{ inputs.commit_sha }}

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact CLI candidate commit
        required: true
        type: string
      check:
        description: Native scenario to verify
        type: choice
        default: headless-stdout
        options:
          - headless-stdout
          - approval-recovery
          - long-task-reclaim

permissions:
  contents: read

jobs:
  native-scenario:
    name: ${{ inputs.check }} (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      CLI_SHA: ${{ inputs.commit_sha }}
      npm_config_onnxruntime_node_install_cuda: skip
    steps:
      - name: Validate candidate SHA
        shell: bash
        run: '[[ "$CLI_SHA" =~ ^[0-9a-f]{40}$ ]]'

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22.12.0"

      - name: Verify exact CLI checkout
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$CLI_SHA"
          test "$(node -p 'process.platform')" = darwin
          test "$(node -p 'process.arch')" = x64

      - name: Install CLI dependencies
        run: npm ci --workspace packages/cli --include-workspace-root=false --legacy-peer-deps --no-audit --no-fund

      - name: Run the selected native fixture
        if: inputs.check != 'approval-recovery'
        shell: bash
        env:
          CHECK: ${{ inputs.check }}
        run: |
          case "$CHECK" in
            headless-stdout)
              fixture=headless-native-filesystem
              receipt=stdout-delivery.ndjson
              set -- --stdout-only
              ;;
            long-task-reclaim)
              fixture=headless-long-task-reclaim
              receipt=task-reclaim.ndjson
              set --
              ;;
            *) exit 64 ;;
          esac
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          source="packages/cli/__tests__/fixtures/$fixture"
          temporary="$source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.mjs"
          test ! -e "$temporary"
          trap 'rm -f -- "$temporary"' EXIT
          # Run the selected test fixture against the exact candidate CLI and helpers.
          git show "$GITHUB_SHA:$source.mjs" > "$temporary"
          report="$RUNNER_TEMP/$CHECK-evidence"
          mkdir -p "$report"
          node "$temporary" "$@" | tee "$report/$receipt"
          printf '%s\n' "$CLI_SHA" > "$report/cli-commit.txt"
          printf '%s\n' "$GITHUB_SHA" > "$report/fixture-commit.txt"

      - name: Upload native fixture evidence
        if: inputs.check != 'approval-recovery'
        uses: actions/upload-artifact@v6
        with:
          name: cli-${{ inputs.check }}-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ inputs.check }}-evidence/
          if-no-files-found: error

      - name: Verify interactive approval recovery across CLI processes
        if: inputs.check == 'approval-recovery'
        working-directory: packages/cli
        shell: bash
        run: |
          report="$RUNNER_TEMP/approval-recovery-evidence"
          mkdir -p "$report"
          printf '%s\n' "$CLI_SHA" > "$report/cli-commit.txt"
          node -p 'JSON.stringify({platform: process.platform, architecture: process.arch, node: process.version})' > "$report/runtime.json"
          vitest="$(node -p 'const path = require("node:path"); path.join(path.dirname(require.resolve("vitest/package.json")), "vitest.mjs")')"
          node "$vitest" run --config vitest.e2e.config.js \
            __tests__/e2e/repl-plan-approval.test.js --maxWorkers=1 \
            --reporter=default --reporter=json --outputFile="$report/approval-recovery.json"

      - name: Upload approval recovery evidence
        if: always() && inputs.check == 'approval-recovery'
        uses: actions/upload-artifact@v6
        with:
          name: cli-approval-recovery-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approval-recovery-evidence/
          if-no-files-found: warn
